app-id: io.github.coreharbor.Brewdoro
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: brewdoro

finish-args:
  - --share=ipc
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio

modules:
  - name: brewdoro
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - PYTHONPATH=src python3 -m unittest discover -s tests -v
      - install -Dm0644 data/io.github.coreharbor.Brewdoro.desktop ${FLATPAK_DEST}/share/applications/io.github.coreharbor.Brewdoro.desktop
      - install -Dm0644 data/io.github.coreharbor.Brewdoro.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.coreharbor.Brewdoro.metainfo.xml
      - install -Dm0644 data/icons/hicolor/scalable/apps/io.github.coreharbor.Brewdoro.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.coreharbor.Brewdoro.svg
      - install -Dm0644 LICENSE ${FLATPAK_DEST}/share/licenses/io.github.coreharbor.Brewdoro/LICENSE
    sources:
      - type: git
        url: https://github.com/coreharbor/brewdoro.git
        tag: v0.5.0
        commit: 12ed866b1fcd2fe8679b3418ae954bfafd6ca348
        x-checker-data:
          type: git
          tag-pattern: ^v([0-9]+\.[0-9]+\.[0-9]+)$
