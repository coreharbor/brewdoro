app-id: ru.brewdoro.timer
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: brewdoro

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: brewdoro
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm0644 data/ru.brewdoro.timer.desktop ${FLATPAK_DEST}/share/applications/ru.brewdoro.timer.desktop
      - install -Dm0644 data/ru.brewdoro.timer.metainfo.xml ${FLATPAK_DEST}/share/metainfo/ru.brewdoro.timer.metainfo.xml
      - install -Dm0644 data/icons/hicolor/scalable/apps/ru.brewdoro.timer.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/ru.brewdoro.timer.svg
      - install -Dm0644 LICENSE ${FLATPAK_DEST}/share/licenses/ru.brewdoro.timer/LICENSE
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .venv
          - .mypy_cache
          - .ruff_cache
          - .flatpak-builder
          - .flatpak-build
          - build
          - dist
          - "*.egg-info"
          - __pycache__
